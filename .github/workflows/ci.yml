name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Check Python scripts and tests
        run: |
          .venv/bin/python -m py_compile scripts/*.py
          .venv/bin/python -m unittest discover -s tests -v
      - name: Typecheck macOS app and launcher
        run: |
          swiftc -typecheck ClimbingHoldCard.swift
          swiftc -typecheck HoldLauncher.swift
      - name: Validate gallery
        run: python3 -c 'import json; x=json.load(open("gallery.json")); assert len(x)==15 and len({a["id"] for a in x})==15'
